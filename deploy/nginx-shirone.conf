server {
    listen 80 default_server;
    server_name _;
    root /var/www/shirone/current;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    location /admin {
        return 308 https://62.234.3.154$request_uri;
    }
    location /__admin/ {
        return 308 https://62.234.3.154$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 443 ssl;
    server_name 62.234.3.154;
    ssl_certificate /etc/nginx/thunder-web/tls.crt;
    ssl_certificate_key /etc/nginx/thunder-web/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/shirone/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location /__admin/api/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:4324;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 540s;
        proxy_send_timeout 540s;
        proxy_buffering off;
    }
    location /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
